<script>
function myFunct(a, b, x) {
    let calc = function(i) {
        console.log(i + b);
        return i + b;
    }
    if (a < 20) 
        return calc(a);
    else {
        console.log(a);
        return calc;
    }
}

let x = myFunct(12, 8); // Returns and logs 20 | (12+8)
let y = myFunct(21, 7); // Logs 21 and then returns function because a >= 20
y(14); // Calls the returned function with i=14, logs and returns 21 (14+7)
y(9, 33); // Calls the returned function with i=9, logs and returns 16 (9+7)
